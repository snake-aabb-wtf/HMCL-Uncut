name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_NAME: HMCL-3.17.0.362-uncut

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 JDK 17（含 JavaFX）
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: 构建
        run: xvfb-run --auto-servernum bash gradlew build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: 重命名产物
        run: |
          set -e
          cd HMCL/build/libs
          for f in HMCL-*.jar HMCL-*.exe HMCL-*.sh HMCL-*.deb; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "${{ env.RELEASE_NAME }}.$ext"
          done
          ls -l

      - name: 生成校验和
        run: |
          set -e
          cd HMCL/build/libs
          for f in ${{ env.RELEASE_NAME }}.*; do
            [ -e "$f" ] && sha256sum "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HMCL-Uncut
          path: |
            HMCL/build/libs/${{ env.RELEASE_NAME }}.*
            HMCL/build/libs/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
